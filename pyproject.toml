[project]
name = "koprm"
version = "0.1.0"
description = "Korean PRM via label projection through a translation bridge"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "vllm==0.15.0",
    "transformers==4.57.3",
    "datasets>=4.4.2",
    "math-verify>=0.9.0",
    "latex2sympy2_extended",
    "pebble",
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "tqdm",
    "hf_transfer",
    "accelerate",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["koprm"]

[tool.ruff]
line-length = 100
